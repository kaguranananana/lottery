# 独立端到端测试栈，不挂载现有部署数据，不复用业务容器名称。
name: lottery-rocketmq-e2e
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:13309:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.2
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  nameserver:
    image: apache/rocketmq:5.3.4
    command: ["sh", "mqnamesrv"]
    environment:
      JAVA_OPT_EXT: "-Xms128m -Xmx256m -Xmn64m"
    ports: ["127.0.0.1:19876:9876"]
  broker-store:
    image: apache/rocketmq:5.3.4
    user: "0"
    entrypoint: ["/bin/sh", "-c", "chown 3000:3000 /home/rocketmq/store"]
    volumes:
      - rocketmq-store:/home/rocketmq/store
  broker:
    image: apache/rocketmq:5.3.4
    command: ["sh", "mqbroker", "-n", "nameserver:9876", "-c", "/etc/rocketmq/broker.conf"]
    depends_on:
      nameserver:
        condition: service_started
      broker-store:
        condition: service_completed_successfully
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx512m -Xmn128m"
    ports: ["127.0.0.1:10911:10911"]
    volumes:
      - ./broker.conf:/etc/rocketmq/broker.conf:ro
      - rocketmq-store:/home/rocketmq/store
volumes:
  rocketmq-store:
