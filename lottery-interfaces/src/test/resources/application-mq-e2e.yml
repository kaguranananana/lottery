# 仅连接独立 RocketMQ E2E 栈。
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:13309/lottery?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
  redis:
    host: 127.0.0.1
    port: 16379
    password: ""
lottery:
  rocketmq:
    nameserver: 127.0.0.1:19876
    producer-group: lottery-e2e-tx
    stock-group: lottery-e2e-stock
    fulfillment-group: lottery-e2e-fulfillment
    consumers-auto-start: false
  scheduling:
    enabled: false
