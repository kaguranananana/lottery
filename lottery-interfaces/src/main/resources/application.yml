server:
  port: 8080

spring:
  task:
    scheduling:
      # 三个固定延迟任务各有调度线程，扫描不会互相等待。
      pool:
        size: 3
      thread-name-prefix: lottery-schedule-
  datasource:
    # MyBatis 与 TransactionTemplate 共用 Spring Boot 自动配置的连接池。
    url: ${LOTTERY_DB_URL:jdbc:mysql://127.0.0.1:13306/lottery?useUnicode=true&serverTimezone=Asia/Shanghai&useLocalSessionState=true}
    username: ${LOTTERY_DB_USER:root}
    password: ${LOTTERY_DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 48
      minimum-idle: 12
      connection-timeout: 5000
      validation-timeout: 1000
  redis:
    host: localhost
    port: 6379
    password: 060214.yjx # 如果你的Redis设置了密码，请在这里填写密码；如果没有密码，保持为空或删除这一行
    database: 0
    timeout: 5000
    jedis:
      pool:
        max-active: 128
        max-wait: 2000ms
        max-idle: 32
        min-idle: 8

lottery:
  scheduling:
    activity-delay-ms: 10000
    stock-delay-ms: 10000
    fulfillment-delay-ms: 10000
  outbox:
    workers: 6
    max-in-flight: 128
    scan-batch-size: 32
  draw:
    # HTTP 限流共享 Redis 配额，本机并发阈值独立配置。
    admission:
      enabled: true
      global-rate: 100
      global-burst: 32
      user-rate: 2
      user-burst: 3
      max-concurrent: 24
  ids:
    # 默认值仅供本地单实例；多实例部署为每个实例分配唯一的 0..31 节点号。
    worker-id: ${LOTTERY_WORKER_ID:0}
    # 同一数据中心共用该值，不同数据中心使用不同的 0..31 编号。
    datacenter-id: ${LOTTERY_DATACENTER_ID:1}
  rocketmq:
    nameserver: ${LOTTERY_ROCKETMQ_NAMESERVER:127.0.0.1:9876}
    producer-group: ${LOTTERY_ROCKETMQ_PRODUCER_GROUP:lottery-order-tx}
    stock-group: ${LOTTERY_ROCKETMQ_STOCK_GROUP:lottery-stock}
    fulfillment-group: ${LOTTERY_ROCKETMQ_FULFILLMENT_GROUP:lottery-fulfillment}
    consumer-threads: 4
  cache:
    draw-inflight-redis-ttl-seconds: 3
    no-consumed-order-redis-ttl-seconds: 1800
    # 活动奖池快照：唯一的两级缓存（Caffeine L1 + Redis L2），高频读、低变更。
    # 一致性边界：快照为短 TTL 最终一致，运营变更配置后需等 TTL 过期生效；不做广播失效。
    activity-prize-snapshot:
      local-expire-seconds: 60
      local-max-size: 10000
      redis-expire-seconds: 600
      redis-expire-jitter-seconds: 120
      null-redis-expire-seconds: 60
    # 活动配置仅走 Redis 单级（低频变更、允许短暂滞后）
    activity:
      redis-expire-seconds: 300
      redis-expire-jitter-seconds: 60
      null-redis-expire-seconds: 30



mybatis:
  # 1. 对应你 XML 里的 <package name="...po"/>
  type-aliases-package: com.anontokyo.lottery.infrastructure.po
  # 2. 告诉 MyBatis 去哪里找 SQL 文件
  mapper-locations: classpath:mybatis/mapper/*.xml
  configuration:
    # 3. 开启我们之前讨论的驼峰转换（之前 XML 里没有，现在正好加上）
    map-underscore-to-camel-case: true
    # 4. 打印 SQL 日志（调试神器，建议开启）
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
