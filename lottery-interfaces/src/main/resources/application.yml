spring:
  redis:
    host: localhost
    port: 6379
    password: 060214.yjx # 如果你的Redis设置了密码，请在这里填写密码；如果没有密码，保持为空或删除这一行
    database: 0
    timeout: 5000
    jedis:
      pool:
        max-active: 128
        max-wait: 2000ms
        max-idle: 32
        min-idle: 8

  kafka:
    # Kafka服务器地址
    bootstrap-servers: localhost:9092

    # 生产者配置
    producer:
      # 发生错误后，消息重发的次数
      retries: 1
      # 当有多个消息需要被发送到同一个分区时，生产者会把它们放在同一个批次里
      # 该参数指定了一个批次可以使用的内存大小，按照字节数计算
      batch-size: 16384
      # 设置生产者内存缓冲区的大小
      buffer-memory: 33554432
      # 键的序列化方式
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # 值的序列化方式
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # acks=0：生产者在成功写入消息之前不会等待任何来自服务器的响应
      # acks=1：只要集群的首领节点收到消息，生产者就会收到一个来自服务器成功响应
      # acks=all：只有当所有参与复制的节点全部收到消息时，生产者才会收到一个来自服务器的成功响应
      acks: 1

    # 消费者配置
    consumer:
      # 自动提交的时间间隔（在Spring Boot 2.X 版本中这里采用的是值的类型为Duration）
      auto-commit-interval: 1S
      # 该属性指定了消费者在读取一个没有偏移量的分区或者偏移量无效的情况下该作何处理：
      # latest（默认值）：在偏移量无效的情况下，消费者将从最新的记录开始读取数据
      # earliest：在偏移量无效的情况下，消费者将从起始位置读取分区的记录
      auto-offset-reset: latest
      # 是否自动提交偏移量，默认值是true
      # 为了避免出现重复数据和数据丢失，可以把它设置为false，然后手动提交偏移量
      enable-auto-commit: false
      # 键的反序列化方式
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 值的反序列化方式
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    # 监听器配置
    listener:
      # 在侦听器容器中运行的线程数
      concurrency: 5
      # listener负责ack，每调用一次，就立即commit
      ack-mode: manual_immediate
      # 如果至少有一个topic不存在，是否启动失败
      missing-topics-fatal: false

lottery:
  kafka:
    activity-partake:
      enabled: true
    invoice:
      enabled: true
    topic:
      invoice:
        partitions: 8
        replicas: 1
      activity-partake:
        partitions: 4
        replicas: 1
      strategy-award-stock:
        partitions: 8
        replicas: 1
    consumer:
      invoice-group-id: lottery-invoice-20260315
      activity-partake-group-id: lottery-activity-partake-20260315
      strategy-award-stock-group-id: lottery-strategy-award-stock-20260315
      invoice-concurrency: 4
      activity-partake-concurrency: 2
      strategy-award-stock-concurrency: 4
    dispatcher:
      strategy-award-stock:
        enabled: true
      strategy-award-stock-batch-size: 10
      strategy-award-stock-initial-delay-millis: 1000
      strategy-award-stock-fixed-delay-millis: 5000
  cache:
    draw-inflight-redis-ttl-seconds: 3
    no-consumed-order-redis-ttl-seconds: 1800
    no-stock-award-list-redis-ttl-seconds: 60
    strategy-award-stock-mq-dedup-redis-ttl-seconds: 86400
    strategy-award-stock-mq-processing-redis-ttl-seconds: 300
    strategy-award-stock-mq-dispatch-redis-ttl-seconds: 60
    invoice-mq-processing-redis-ttl-seconds: 300
    activity:
      local-expire-seconds: 1
      redis-expire-seconds: 5
      redis-expire-jitter-seconds: 2
      null-redis-expire-seconds: 15
      local-max-size: 10000
    strategy-rich:
      local-expire-seconds: 30
      redis-expire-seconds: 600
      redis-expire-jitter-seconds: 120
      null-redis-expire-seconds: 60
      local-max-size: 10000
    award:
      local-expire-seconds: 30
      redis-expire-seconds: 600
      redis-expire-jitter-seconds: 120
      null-redis-expire-seconds: 60
      local-max-size: 10000
    rule-tree:
      local-expire-seconds: 30
      redis-expire-seconds: 1800
      redis-expire-jitter-seconds: 300
      null-redis-expire-seconds: 60
      local-max-size: 1000



# 多数据源路由配置
mini-db-router:
  jdbc:
    datasource:
      dbCount: 2
      tbCount: 4
      default: db00
      routerKey: uId
      list: db01,db02
      global:
        pool:
          maximum-pool-size: 48
          minimum-idle: 12
          connection-timeout: 5000
          validation-timeout: 1000
          idle-timeout: 600000
          max-lifetime: 1800000
      db00:
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://127.0.0.1:13306/lottery?useUnicode=true&serverTimezone=Asia/Shanghai
        username: root
        password: root
