mybatis:
  # 1. 对应你 XML 里的 <package name="...po"/>
  type-aliases-package: com.anontokyo.lottery.infrastructure.po
  # 2. 告诉 MyBatis 去哪里找 SQL 文件
  mapper-locations: classpath:mybatis/mapper/*.xml
  configuration:
    # 3. 开启我们之前讨论的驼峰转换（之前 XML 里没有，现在正好加上）
    map-underscore-to-camel-case: true
    # 4. 打印 SQL 日志（调试神器，建议开启）
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

nacos:
  discovery:
    server-addr: localhost:8848

# Dubbo 广播方式配置
dubbo:
  application:
    name: Lottery
    version: 1.0.0
  registry:
    address: nacos://localhost:8848
  protocol:
    name: dubbo
    port: -1
    threadpool: fixed
    threads: 400
    queues: 200
  provider:
    timeout: 7000
  scan:
    base-packages: com.anontokyo.lottery.rpc


# XXL-JOB配置
xxl:
  job:
    admin:
      # 调度中心地址（多个用逗号分隔）
      addresses: http://localhost:7397/xxl-job-admin
    executor:
      # 执行器名称（唯一，在调度中心配置）
      appname: lottery-job
      # 执行器注册地址（为空则自动获取）
      address: http://127.0.0.1:9999
      # 执行器IP（为空则自动获取）
      ip:
      # 执行器端口（调度中心通过此端口调用）
      port: 9999
      # 执行器日志路径
      logpath: D:/logs/xxl-job/jobhandler
      # 日志保留天数
      logretentiondays: 30
    # 访问令牌（调度中心和执行器要一致）
    accessToken:
