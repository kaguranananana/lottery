# 独立压测栈；端口仅绑定本机，不挂载其它项目数据。
name: lottery-perf
services:
  mysql:
    image: mysql:8.0.46
    cpus: 2
    mem_limit: 2g
    environment:
      MYSQL_ROOT_PASSWORD: perf-only
      TZ: Asia/Shanghai
    ports: ['127.0.0.1:13329:3306']
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci', '--slow-query-log=ON', '--long-query-time=0.05', '--log-output=TABLE']
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-pperf-only']
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.2.16
    cpus: 1
    mem_limit: 256m
    ports: ['127.0.0.1:17379:6379']
    command: ['redis-server', '--latency-monitor-threshold', '1']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10
  zookeeper:
    image: zookeeper:3.8.7
    cpus: 0.5
    mem_limit: 384m
    environment:
      JVMFLAGS: '-Xms128m -Xmx256m'
  kafka:
    image: wurstmeister/kafka:2.13-2.8.1
    platform: linux/amd64
    cpus: 2
    mem_limit: 1g
    stop_grace_period: 40s
    depends_on: [zookeeper]
    ports: ['127.0.0.1:29092:9092']
    environment:
      KAFKA_HEAP_OPTS: '-Xms256m -Xmx512m'
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:39092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:39092,EXTERNAL://127.0.0.1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    healthcheck:
      test: ['CMD', '/opt/kafka/bin/kafka-topics.sh', '--bootstrap-server', 'kafka:39092', '--list']
      interval: 5s
      timeout: 10s
      retries: 25
